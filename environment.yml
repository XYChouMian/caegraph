# Reproducible description of the CAEGraph development environment.
# Recreate with:  conda env create -f environment.yml
name: caegraph-dev

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      # Core scientific stack (mirrors pyproject.toml dependencies)
      - numpy>=1.24
      - meshio>=5.3
      - torch>=2.5
      - torch-geometric>=2.5,<3.0
      # Documentation
      - mkdocs
      - mkdocs-material
      - mkdocstrings[python]
      - mkdocs-static-i18n
      # Testing
      - pytest
      - pytest-cov
      # Code quality
      - black
      - ruff
      - mypy
      - pylint
      - pre-commit
