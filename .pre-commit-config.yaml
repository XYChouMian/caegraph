# CAEGraph pre-commit hooks: every commit is auto-checked.
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  # --- Formatting -----------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^(src|tests)/

  # --- Linting --------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/

  # --- Basic hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.puml$
      - id: trailing-whitespace
        exclude: \.puml$
      - id: check-yaml
        alias: check-yaml-strict
        exclude: ^docs/mkdocs\.yml$
        files: ^(docs|\.github|architecture/decisions)/.*\.ya?ml$
      - id: check-yaml
        alias: check-yaml-mkdocs-tags
        # docs/mkdocs.yml 使用 MkDocs 必需的 `!!python/name:` 扩展标签，strict load
        # 无法构造它；仅该文件放宽为 parse-only。代价（显式记录）：不再检测重复键、
        # 允许多文档、无跨实现可移植性保证；其余被覆盖文件保持 strict 不变。
        args: [--unsafe]
        files: ^docs/mkdocs\.yml$
      - id: check-toml
        files: pyproject.toml

  # --- Tests (only when runtime or test inputs change) ----------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        files: ^(src|tests)/|^(pyproject\.toml|environment\.yml|requirements[^/]*\.txt|\.github/workflows/test\.yml)$
        stages: [pre-commit]
