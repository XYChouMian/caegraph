# CAEGraph pre-commit hooks: every commit is auto-checked.
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  # --- Formatting -----------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^(src|tests)/

  # --- Linting --------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/

  # --- Basic hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.puml$
      - id: trailing-whitespace
        exclude: \.puml$
      - id: check-yaml
        # --unsafe = 只解析语法、不加载：docs/mkdocs.yml 使用 MkDocs 必需的
        # `!!python/name:` 扩展标签，默认的 safe load 无法构造它（钩子在已提交
        # 文件上必然失败）；语法错误仍会被拦截。
        args: [--unsafe]
        files: ^(docs|\.github|architecture/decisions)/.*\.ya?ml$
      - id: check-toml
        files: pyproject.toml

  # --- Tests (only when runtime or test inputs change) ----------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        files: ^(src|tests)/|^(pyproject\.toml|environment\.yml|requirements[^/]*\.txt|\.github/workflows/test\.yml)$
        stages: [pre-commit]
